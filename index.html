<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b2b">
  <meta name="description" content="나만의 야구 선수를 만들고 드래프트부터 은퇴까지 성장시키는 야구 커리어 게임">
  <title>DIAMOND — Baseball Career</title>
  <link rel="stylesheet" href="./assets/css/main.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">

    </main>
    <footer class="footer">DIAMOND BASEBALL CAREER <span>·</span> FIRST PLAYABLE BUILD</footer>

  <div id="toast-region" class="toast-region" aria-live="polite"></div>

</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b2b">
  <meta name="description" content="나만의 야구 선수를 만들고 드래프트부터 은퇴까지 성장시키는 야구 커리어 게임">
  <title>DIAMOND — Baseball Career</title>
  <link rel="stylesheet" href="./assets/css/main.css">
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="DIAMOND 홈"><span class="brand-mark">D</span><span>DIAMOND<small>BASEBALL CAREER</small></span></a>
      <div class="topbar-right"><span class="build-label">LIVE BASEBALL CAREER</span></div>
    </header>
    <main id="screen" class="screen" aria-live="polite">
      <section class="loading"><div class="loader"></div><p>게임 화면을 불러오고 있습니다.</p></section>
    </main>
    <footer class="footer">DIAMOND BASEBALL CAREER <span>·</span> ORIGINAL 3D BALLPARKS</footer>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script type="module">
    let bootTimer;
    try {
      await Promise.race([
        import("./src/app.js"),
        new Promise((_, reject) => { bootTimer = setTimeout(() => reject(new Error("앱 시작 시간 초과")), 12000); })
      ]);
      clearTimeout(bootTimer);
    } catch (error) {
      clearTimeout(bootTimer);
      const screen = document.querySelector("#screen");
      if (screen) screen.innerHTML = '<div class="stadium-fallback"><b>게임 화면을 불러오지 못했습니다.</b><span>필수 파일이나 네트워크 연결에 문제가 있을 수 있습니다. 잠시 후 새로고침해 주세요.</span><button class="btn btn-primary" onclick="location.reload()">새로고침</button></div>';
      console.error("DIAMOND boot failed", error);
    }
  </script>
</body>
</html>
